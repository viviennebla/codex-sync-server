<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>蹬了吗</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://lf-scm-cn.feishucdn.com/lark/op/h5-js-sdk-1.5.44.js"></script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-title">蹬了吗</span>
        <span class="brand-spark">〽</span>
      </div>
      <div class="today-total">
        <span>今日</span>
        <strong id="todayTotal">—</strong>
        <span class="tiny-bars" aria-hidden="true"><i></i><i></i><i></i></span>
      </div>
      <button id="pairButton" class="bind-button" type="button">🔗 绑定设备</button>
    </header>

    <section class="office-strip" aria-hidden="true">
      <div class="plant plant-left">🌿</div>
      <div class="sleepy-cat">🐈</div>
      <div class="sticky-note note-a">少点 Bug<br>多点快乐 :)</div>
      <div class="window">
        <span class="cloud cloud-a"></span>
        <span class="cloud cloud-b"></span>
        <span class="building b1"></span><span class="building b2"></span>
        <span class="building b3"></span><span class="building b4"></span>
      </div>
      <div class="sticky-note note-b">下班<br>骑一会 :)</div>
      <div class="plant plant-right">🌱</div>
    </section>

    <section class="race-stage" aria-label="蹬了吗赛场">
      <div class="track-motion" aria-hidden="true"></div>
      <div id="lane1" class="lane" data-lane="1"><span class="lane-number">1</span></div>
      <div id="lane2" class="lane" data-lane="2"><span class="lane-number">2</span></div>
      <div id="lane3" class="lane" data-lane="3"><span class="lane-number">3</span></div>
      <div id="lane4" class="lane" data-lane="4"><span class="lane-number">4</span></div>
      <div class="finish-mark" aria-hidden="true"></div>
    </section>

    <section class="desk-edge" aria-hidden="true">
      <div class="monitor"><span>&lt;/&gt;</span></div>
      <div class="desk-note">骑一会<br>再写 :)</div>
      <div class="mug">&lt;/&gt;</div>
      <div class="chair"></div>
      <div class="desk-cat">🐈</div>
    </section>
  </main>
  <dialog id="pairDialog" class="pair-dialog">
    <form method="dialog" class="dialog-card">
      <button class="dialog-close" value="cancel" aria-label="关闭">×</button>
      <p class="dialog-kicker">绑定一个 Codex 环境</p>
      <h2>让这台设备也来蹬</h2>
      <p class="dialog-copy">每台 Windows / WSL / Server 分别绑定一次，最后会自动算到同一个人。</p>
      <button id="createPairingButton" type="button" class="dialog-primary">生成 pairing code</button>
      <div id="pairingResult" class="pairing-result hidden">
        <code id="pairingCode"></code>
        <pre id="bindCommand"></pre>
        <p>5 分钟有效</p>
      </div>
    </form>
  </dialog>

  <div id="loginOverlay" class="login-overlay">
    <div class="login-card">
      <div class="mini-bike">🚲</div>
      <strong id="status">正在从飞书进入赛场…</strong>
      <button id="retryButton" class="retry-button hidden" type="button">重新登录</button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
</body>
</html>
