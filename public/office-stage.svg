  <!-- Bottom band shelves -->
  <g transform="translate(0 650)" filter="url(#soft)">
    <rect x="0" y="60" width="204" height="106" rx="0 12 12 0" fill="#d3b088"/>
    <rect x="18" y="76" width="72" height="70" rx="6" fill="#e3c49e"/>
    <rect x="103" y="76" width="72" height="70" rx="6" fill="#e3c49e"/>
    <g fill="#5d7180">
      <rect x="22" y="26" width="15" height="34" rx="3"/><rect x="41" y="18" width="18" height="42" rx="3"/>
      <rect x="64" y="31" width="16" height="29" rx="3"/><rect x="85" y="13" width="15" height="47" rx="3"/>
    </g>
    <path d="M144 56C132 36 134 18 148 4M149 58c12-17 26-24 41-23" stroke="#628d58" stroke-width="6" fill="none"/>
    <g fill="#79a968"><circle cx="148" cy="6" r="11"/><circle cx="191" cy="36" r="11"/><circle cx="132" cy="31" r="10"/></g>
