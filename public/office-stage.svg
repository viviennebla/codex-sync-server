<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 820" preserveAspectRatio="none">
  <defs>
    <pattern id="wood" width="180" height="54" patternUnits="userSpaceOnUse">
      <rect width="180" height="54" fill="#f4dfbd"/>
      <path d="M0 53H180M0 27H180M90 0V27M28 27V54M145 27V54" stroke="#e6cba2" stroke-width="2" opacity=".45"/>
    </pattern>
    <pattern id="speckle" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#f3eadb"/>
      <circle cx="6" cy="9" r="1.4" fill="#d9c9b8" opacity=".5"/>
      <circle cx="24" cy="20" r="1.1" fill="#d8c4ae" opacity=".42"/>
    </pattern>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7e5f5"/>
      <stop offset="1" stop-color="#a9cee3"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#67717a" flood-opacity=".12"/>
    </filter>
  </defs>

  <!-- Four office areas are painted by CSS so time-of-day can recolor them. -->

  <!-- Upper office wall and skyline window -->
  <rect x="650" y="18" width="660" height="88" rx="4" fill="none" stroke="#6f8799" stroke-width="5"/>
  <path d="M650 105H1310" stroke="#6f8799" stroke-width="5"/>
  <path d="M815 18V106M980 18V106M1145 18V106" stroke="#8095a5" stroke-width="4" opacity=".75"/>
  <g fill="#87a8bd" opacity=".65">
    <rect x="700" y="67" width="54" height="39"/><rect x="778" y="53" width="42" height="53"/>
    <rect x="865" y="38" width="64" height="68"/><rect x="1016" y="61" width="46" height="45"/>
    <rect x="1102" y="45" width="68" height="61"/><rect x="1210" y="57" width="48" height="49"/>
  </g>
  <g fill="#fff" opacity=".62">
    <ellipse cx="755" cy="43" rx="32" ry="12"/><ellipse cx="778" cy="39" rx="20" ry="14"/>
    <ellipse cx="1198" cy="35" rx="28" ry="11"/><ellipse cx="1219" cy="31" rx="17" ry="12"/>
  </g>

  <!-- Second band left divider -->
  <g transform="translate(0 226)">
