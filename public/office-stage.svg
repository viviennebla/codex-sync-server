    <path d="M94 0V176" stroke="#89aeba" stroke-width="4" opacity=".55"/>
    <rect x="126" y="104" width="116" height="14" rx="7" fill="#a47c57"/>
    <rect x="142" y="118" width="10" height="44" fill="#8d6b4d"/><rect x="216" y="118" width="10" height="44" fill="#8d6b4d"/>
    <path d="M190 0v48" stroke="#ae7958" stroke-width="6"/><path d="M164 50h52l-12 28h-28Z" fill="#ef8662"/>
    <g transform="translate(244 88)">
      <path d="M18 58C7 35 8 17 20 0M22 59c10-22 25-32 42-37" stroke="#608b55" stroke-width="6" fill="none"/>
      <g fill="#7faa68"><circle cx="19" cy="4" r="12"/><circle cx="64" cy="23" r="13"/><circle cx="9" cy="31" r="11"/></g>
      <rect x="4" y="56" width="42" height="34" rx="7" fill="#f3efe5"/>
