  <g transform="translate(22 447)" filter="url(#soft)">
    <path d="M32 126V75c0-34 24-58 63-58s63 24 63 58v51Z" fill="#ef8064"/>
    <rect x="50" y="63" width="90" height="47" rx="16" fill="#f58e70"/>
    <rect x="78" y="74" width="38" height="26" rx="8" fill="#fff0cf"/>
