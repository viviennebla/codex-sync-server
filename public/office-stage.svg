    <rect x="24" y="32" width="54" height="42" rx="4" fill="#f5d978"/>
    <rect x="98" y="50" width="60" height="42" rx="4" fill="#f1cf73"/>
    <rect x="22" y="116" width="110" height="38" rx="7" fill="#e8e5df"/>
    <g transform="translate(156 20)">
      <path d="M28 74c-8-24-3-44 18-59M26 74C14 52 11 34 19 17M28 74c12-18 27-29 45-33" stroke="#608b55" stroke-width="6" fill="none"/>
      <g fill="#7eaa6a"><circle cx="17" cy="17" r="11"/><circle cx="46" cy="14" r="12"/><circle cx="73" cy="41" r="11"/><circle cx="15" cy="46" r="10"/></g>
      <rect x="10" y="73" width="40" height="30" rx="7" fill="#b47b54"/>
    </g>
  </g>

  <!-- Second band coffee bar -->
  <g transform="translate(1608 248)" filter="url(#soft)">
    <rect x="0" y="78" width="284" height="96" rx="10" fill="#d2a577"/>
    <rect x="16" y="92" width="76" height="66" rx="6" fill="#e4bd93"/>
    <rect x="106" y="92" width="76" height="66" rx="6" fill="#e4bd93"/>
    <rect x="28" y="0" width="92" height="76" rx="10" fill="#48525c"/>
    <rect x="44" y="14" width="60" height="22" rx="5" fill="#717c85"/>
    <rect x="52" y="44" width="42" height="24" rx="8" fill="#2f363c"/>
    <circle cx="214" cy="40" r="20" fill="#7fa86a"/><rect x="203" y="58" width="23" height="18" rx="4" fill="#e2c299"/>
    <circle cx="256" cy="57" r="14" fill="#91b476"/><rect x="248" y="69" width="18" height="14" rx="4" fill="#e2c299"/>
