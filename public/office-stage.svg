    <circle cx="204" cy="101" r="20" fill="#76a66b"/><rect x="193" y="117" width="22" height="18" rx="4" fill="#d4b184"/>
    <g transform="translate(0 -6)">
      <path d="M22 68C4 38 4 17 17 0M28 71C31 38 46 18 63 6M20 70C-2 56-13 41-17 23" stroke="#5f8c55" stroke-width="7" fill="none"/>
      <g fill="#7baa68"><ellipse cx="17" cy="4" rx="18" ry="11" transform="rotate(-30 17 4)"/><ellipse cx="63" cy="9" rx="18" ry="11" transform="rotate(26 63 9)"/><ellipse cx="-13" cy="24" rx="16" ry="10" transform="rotate(25 -13 24)"/></g>
      <rect x="2" y="69" width="46" height="38" rx="8" fill="#f3efe5"/>
