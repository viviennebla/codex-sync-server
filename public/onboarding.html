<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>绑定蹬了吗</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px; background: #e76543; color: #27313c; }
    .card { width: min(620px, 100%); padding: 34px; border: 4px solid #27313c; border-radius: 28px; background: #fff8e8; box-shadow: 10px 12px 0 rgba(39,49,60,.22); transform: rotate(-.4deg); }
    .eyebrow { margin: 0 0 8px; font-weight: 900; letter-spacing: .08em; color: #8c4a35; }
    h1 { margin: 0; font-size: clamp(34px, 7vw, 58px); line-height: 1; }
    .lead { margin: 18px 0 26px; font-size: 18px; line-height: 1.65; }
    .steps { margin: 0 0 28px; padding: 0; list-style: none; display: grid; gap: 12px; }
    .steps li { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; font-weight: 750; line-height: 1.5; }
    .num { width: 30px; height: 30px; display: grid; place-items: center; border: 3px solid #27313c; border-radius: 50%; background: #f5d45f; font-weight: 950; }
    .button { display: flex; justify-content: center; align-items: center; width: 100%; min-height: 56px; padding: 12px 20px; border: 3px solid #27313c; border-radius: 16px; background: #27313c; color: #fff; text-decoration: none; font-size: 18px; font-weight: 900; box-shadow: 4px 5px 0 #f0b43d; }
    .button:active { transform: translate(2px,2px); box-shadow: 2px 3px 0 #f0b43d; }
    .hint { margin: 18px 0 0; color: #6c625d; font-size: 14px; line-height: 1.55; }
    code { padding: 2px 6px; border-radius: 6px; background: #eee5d5; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .bike { float: right; font-size: 52px; transform: rotate(-7deg); }
  </style>
</head>
<body>
  <main class="card">
    <div class="bike" aria-hidden="true">🚲</div>
    <p class="eyebrow">PLUGIN 已安装</p>
    <h1>把这台 Codex<br>蹬进赛道</h1>
    <p class="lead">下一步去飞书「蹬了吗」绑定当前设备。每个 Windows / WSL / macOS Codex 环境各绑定一次，同一个飞书账号最终会合并成同一个人。</p>
    <ol class="steps">
      <li><span class="num">1</span><span>打开飞书里的「蹬了吗」。</span></li>
      <li><span class="num">2</span><span>生成 5 分钟有效的一次性 pairing code。</span></li>
      <li><span class="num">3</span><span>回到 Codex 说：<code>绑定蹬了吗 CODE</code></span></li>
    </ol>
    <a id="openFeishu" class="button" href="#">去飞书绑定 →</a>
    <p class="hint">页面会尝试自动唤起飞书。如果没有跳转，请点击上面的按钮；仍打不开时，在飞书工作台搜索「蹬了吗」。</p>
  </main>
  <script>
    const appLink = "https://applink.feishu.cn/client/web_app/open?appId=cli_aa15ccc6faf8dbdb&path=%2F%3Fbind%3D1&mode=sidebar-semi";
    const button = document.getElementById("openFeishu");
    button.href = appLink;
    window.setTimeout(() => { window.location.href = appLink; }, 900);
  </script>
</body>
</html>
